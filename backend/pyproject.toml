[project]
name = "schoolsync-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Depends", "fastapi.Query"]

# PyMuPDF ships no type hints; untyped-call strictness is relaxed for it only.
[[tool.mypy.overrides]]
module = ["app.pdf.layout", "app.ingestion.validate"]
disallow_untyped_calls = false
disable_error_code = ["var-annotated", "arg-type"]
